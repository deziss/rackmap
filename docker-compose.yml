services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      IN_DOCKER: "true"
      NODE_ENV: ${NODE_ENV:-production}
      # Built from the postgres service's credentials below. Set
      # DOCKER_DATABASE_URL to use an external PostgreSQL 18 instead.
      # POSTGRES_PASSWORD goes into a URL here: use URL-safe characters
      # (openssl rand -hex 24), or percent-encode it in DOCKER_DATABASE_URL.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-rackmap}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rackmap}}
      PORT: "3001"
      BETTER_AUTH_URL: http://api:3001
      # nginx (the web service) terminates in front of the API, so forwarding
      # headers come from a proxy we control and can be trusted here.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUSTED_PROXY_CIDRS:
      # Must list every origin the UI is actually reached at. Defaults to
      # WEB_ORIGIN; set explicitly if you browse by host IP as well as by name.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
      # Demo accounts (editor@/viewer@) and sample servers. Never enable in
      # production — the credentials are published in the repository.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Override remaining vars from .env file or env:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      APP_ENCRYPTION_PASSPHRASE: ${APP_ENCRYPTION_PASSPHRASE:-}
      VAULT_PASSPHRASE: ${VAULT_PASSPHRASE:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      PING_INTERVAL_MS: ${PING_INTERVAL_MS:-60000}
      PING_CONCURRENCY: ${PING_CONCURRENCY:-10}
      STATUS_RETENTION_DAYS: ${STATUS_RETENTION_DAYS:-30}
      STATUS_FLIP_THRESHOLD: ${STATUS_FLIP_THRESHOLD:-2}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${NOTIFY_TELEGRAM_BOT_TOKEN:-}
      NOTIFY_TELEGRAM_CHAT_ID: ${NOTIFY_TELEGRAM_CHAT_ID:-}
      # Nightly pg_dump into the `backups` volume (see BACKUP_* in .env.example).
      BACKUP_DIR: /backups
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Browser SSH terminal — set SSH_ENABLED=true to enable (admin-only).
      # Gates only the interactive terminal; other features still exec over SSH.
      SSH_ENABLED: ${SSH_ENABLED:-false}
      SSH_CONNECT_TIMEOUT_MS: ${SSH_CONNECT_TIMEOUT_MS:-10000}
      SSH_IDLE_TIMEOUT_MS: ${SSH_IDLE_TIMEOUT_MS:-300000}
      SSH_MAX_SESSION_MS: ${SSH_MAX_SESSION_MS:-3600000}
      SSH_MAX_CONCURRENT: ${SSH_MAX_CONCURRENT:-5}
      # Live metrics via agentless SSH exec
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_SSH_TIMEOUT_MS: ${METRICS_SSH_TIMEOUT_MS:-10000}
      # Licencia Licensing & Subscription
      LICENCIA_URL: ${LICENCIA_URL:-http://host.docker.internal:3003}
      LICENCIA_API_KEY: ${LICENCIA_API_KEY:-}
      LICENCIA_PUBLIC_KEY: ${LICENCIA_PUBLIC_KEY:-}
      LICENCIA_LICENSE_KEY: ${LICENCIA_LICENSE_KEY:-}

      # ── Passed through from .env only when set ────────────────────────────
      # A bare key (no value) forwards the variable if .env or the shell sets
      # it, and otherwise leaves it unset in the container so the default in
      # apps/api/src/env.ts applies. Do not write `${VAR:-}` for these: an
      # empty string fails validation for the numeric and URL variables and the
      # API refuses to start. Every one is documented in .env.example.
      AUTH_RATE_LIMIT_ENABLED:
      AUTH_RATE_LIMIT_MAX:
      AUTH_RATE_LIMIT_WINDOW:
      AUTH_LOGIN_RATE_LIMIT_MAX:
      AUTH_LOGIN_RATE_LIMIT_WINDOW:
      AUTH_LOGIN_ACCOUNT_RATE_LIMIT_MAX:
      AUTH_LOGIN_ACCOUNT_RATE_LIMIT_WINDOW:
      PUBLIC_BASE_URL:
      BILLING_MODE:
      PING_TIMEOUT_MS:
      JOB_LOCK_TTL_MS:
      BACKUP_CRON:
      BACKUP_KEEP:
      SSH_HOST_POLICY:
      SSH_REAUTH_INTERVAL_MS:
      SSH_PRIVATE_KEY_PATH:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM:
      METRICS_ALERT_ENABLED:
      METRICS_ALERT_INTERVAL_MS:
      ALERT_THRESHOLD_CPU:
      ALERT_THRESHOLD_RAM:
      ALERT_THRESHOLD_DISK:
      ALERT_DISPATCH_ENABLED:
      ALERT_DISPATCH_INTERVAL_MS:
      ALERT_OUTBOUND_TIMEOUT_MS:
      ALERT_OUTBOUND_ALLOW_PRIVATE:
      ALERT_OUTBOUND_ALLOW_HTTP:
      ALERT_OUTBOUND_ALLOWLIST:
      ALERT_DELIVERY_RETENTION_DAYS:
      ALERT_MAX_EVENT_AGE_MS:
      SSL_SCAN_CRON:
      HEARTBEAT_SWEEP_INTERVAL_MS:
      HEARTBEAT_PING_KEEP:
      HEARTBEAT_PING_RETENTION_DAYS:
      HEARTBEAT_PING_MAX_BODY_BYTES:
      STATUS_SAMPLE_INTERVAL_MS:
      STATUS_MAX_ROWS:
      PATCH_SCAN_CRON:
      PATCH_SCAN_CONCURRENCY:
      DRIFT_SCAN_CRON:
      DRIFT_SNAPSHOT_KEEP:
      ACCESS_EXPIRY_SWEEP_INTERVAL_MS:
      PROMETHEUS_SD_DEFAULT_PORT:
      DOCKER_HOST_OVERRIDE:
      HOST_GATEWAY:
      RUNBOOK_WORKER_ENABLED:
      RUNBOOK_MAX_CONCURRENT_RUNS:
      RUNBOOK_MAX_SSH_SESSIONS:
      RUNBOOK_MAX_TARGETS:
      RUNBOOK_OUTPUT_MAX_BYTES:
      RUNBOOK_APPROVAL_TTL_HOURS:
    volumes:
      # /data holds SSH keys (and, on installs upgraded from SQLite, the old
      # inventory.db). The volume keeps its historical name so an upgrade does
      # not silently detach those keys.
      - sqlite_data:/data
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # /health/live returns a literal ok and can never fail while the process
      # is up, which makes it useless as a healthcheck. /health/ready actually
      # touches the database.
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot runs migrations and the seed; without this the retries are
      # spent before the app has had a chance to start.
      start_period: 60s
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }


  # The database. Always started: the API is PostgreSQL-only.
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rackmap}
      # Required — there is deliberately no default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rackmap}
    volumes:
      # PostgreSQL 18 images keep PGDATA at /var/lib/postgresql/18/docker and
      # refuse to start with a volume at the old /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    # Bound to loopback: the API reaches Postgres over the internal network, so
    # publishing it on every interface only widens exposure. Override
    # POSTGRES_BIND if you genuinely need remote access, and POSTGRES_HOST_PORT
    # if the host already runs its own PostgreSQL on 5432.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rackmap} -d ${POSTGRES_DB:-rackmap}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the JS bundle at build time — set false to allow copy/right-click
        VITE_SECURITY_LOCK: ${VITE_SECURITY_LOCK:-false}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # and nginx only listens on IPv4, so the check was always refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  sqlite_data:
  pgdata:
  backups:

networks:
  internal:
