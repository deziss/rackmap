<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rm-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="rm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="rm-rack-face" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="rm-r-curve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="rm-glow-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="rm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#rm-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#rm-border)" stroke-width="2" stroke-opacity="0.85" />

  <!-- Server Rack Left Pillar & Blades -->
  <!-- Left post -->
  <rect x="11" y="14" width="3" height="36" rx="1.5" fill="#6366F1" fill-opacity="0.5" />

  <!-- Rack Blade Unit 1 -->
  <rect x="16" y="14" width="18" height="7.5" rx="2" fill="url(#rm-rack-face)" stroke="#4F46E5" stroke-width="1" />
  <line x1="19" y1="17.75" x2="27" y2="17.75" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="30.5" cy="17.75" r="1.3" fill="#10B981" />

  <!-- Rack Blade Unit 2 -->
  <rect x="16" y="24" width="18" height="7.5" rx="2" fill="url(#rm-rack-face)" stroke="#4F46E5" stroke-width="1" />
  <line x1="19" y1="27.75" x2="25" y2="27.75" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="28" cy="27.75" r="1.3" fill="#38BDF8" />
  <circle cx="31" cy="27.75" r="1.3" fill="#6366F1" />

  <!-- Rack Blade Unit 3 -->
  <rect x="16" y="34" width="18" height="7.5" rx="2" fill="url(#rm-rack-face)" stroke="#4F46E5" stroke-width="1" />
  <line x1="19" y1="37.75" x2="28" y2="37.75" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="31" cy="37.75" r="1.3" fill="#10B981" />

  <!-- Stylized Letter "R" Loop & Dynamic Tail -->
  <!-- Upper loop of R -->
  <path d="M 30 14 H 41 C 47 14 51 17.5 51 22.5 C 51 27.5 47 31 41 31 H 30" 
        stroke="url(#rm-r-curve)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal leg of R with energy beam -->
  <path d="M 39 30 L 49.5 47.5" 
        stroke="url(#rm-r-curve)" stroke-width="3.8" stroke-linecap="round" />

  <!-- Data Hub Node on R intersection -->
  <circle cx="39" cy="30.5" r="3" fill="#06B6D4" filter="url(#rm-glow)" />
  <circle cx="39" cy="30.5" r="1.5" fill="#FFFFFF" />

  <!-- Base Grid Activity Bar -->
  <rect x="15" y="46" width="19" height="3" rx="1.5" fill="#1E293B" />
  <rect x="15" y="46" width="11" height="3" rx="1.5" fill="url(#rm-glow-bar)" />
</svg>