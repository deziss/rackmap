# Only send `Connection: upgrade` when the client actually asked for it.
# Hardcoding it broke keep-alive for every ordinary API request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Inventory imports are XLSX uploads. nginx defaults to 1m, which silently
    # 413s a large sheet, so raise it for the API only.
    client_max_body_size 25m;

    # The SSH terminal is a long-lived WebSocket and genuinely needs a 24h read
    # timeout. Applying that to the whole API meant one hung upstream request
    # tied up a worker connection for a day, so it is scoped to the socket path
    # alone. (A prefix location "/api/v1/servers/" also made nginx answer the
    # server list, GET /api/v1/servers?…, with a 301 to a trailing-slash URL
    # the API does not route.)
    location ~ ^/api/v1/servers/[0-9]+/ssh$ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API proxy — forward to api service
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        # Metrics collection SSHes into a host and sleeps ~1s to sample network
        # counters, so this needs headroom — but not a day.
        proxy_read_timeout 120s;
    }

    # Health endpoints, used by the container healthcheck.
    location /health/ {
        proxy_pass http://api:3001;
        proxy_read_timeout 10s;
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
