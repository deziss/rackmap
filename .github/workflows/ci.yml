name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    # The API is PostgreSQL-only, so the test suite needs a real server. These
    # credentials exist only inside this throwaway service container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rackmap
          POSTGRES_PASSWORD: rackmap_ci
          POSTGRES_DB: rackmap_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rackmap -d rackmap_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # tests/setup.ts refuses any database whose name does not end in _test,
      # then resets it (db push + truncate) once per run.
      TEST_DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_test?schema=public
      # Scratch database for `migrate diff --from-migrations`; Prisma wipes it.
      SHADOW_DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_shadow?schema=public
      # schema.prisma reads env("DATABASE_URL"); point it at the test database.
      DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      # Matches the runtime image (node:24-alpine).
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @inv/api db:generate

      # Uses the server container's own psql, so it does not depend on which
      # client version the runner image happens to ship.
      - name: Create shadow database
        run: docker exec ${{ job.services.postgres.id }} psql -U rackmap -d rackmap_ci_test -c "CREATE DATABASE rackmap_ci_shadow"

      # Fails when schema.prisma and the committed migrations disagree — a
      # model changed without a migration, or a migration edited or truncated
      # after the fact. Exit code 2 means "there is a diff".
      - name: Check for migration drift
        run: >-
          pnpm --filter @inv/api exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      # Must run before typecheck: apps/web's TanStack route tree
      # (src/routeTree.gen.ts) is generated by the Vite plugin at build time
      # and is intentionally not committed, so `tsc` cannot resolve it until
      # the web bundle has been built at least once.
      - name: Build production bundles
        run: pnpm build

      - name: Typecheck workspaces
        run: pnpm -r typecheck

      - name: Run automated test suite
        run: pnpm test
