name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    # The API is PostgreSQL-only, so the test suite needs a real server. These
    # credentials exist only inside this throwaway service container.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rackmap
          POSTGRES_PASSWORD: rackmap_ci
          POSTGRES_DB: rackmap_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rackmap -d rackmap_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # tests/setup.ts refuses any database whose name does not end in _test,
      # then resets it (db push + truncate) once per run.
      TEST_DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_test?schema=public
      # Scratch database for `migrate diff --from-migrations`; Prisma wipes it.
      SHADOW_DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_shadow?schema=public
      # schema.prisma reads env("DATABASE_URL"); point it at the test database.
      DATABASE_URL: postgresql://rackmap:rackmap_ci@localhost:5432/rackmap_ci_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      # Matches the runtime image (node:24-alpine).
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @inv/api db:generate

      # Uses the server container's own psql, so it does not depend on which
      # client version the runner image happens to ship.
      - name: Create shadow database
        run: docker exec ${{ job.services.postgres.id }} psql -U rackmap -d rackmap_ci_test -c "CREATE DATABASE rackmap_ci_shadow"

      # Fails when schema.prisma and the committed migrations disagree — a
      # model changed without a migration, or a migration edited or truncated
      # after the fact. Exit code 2 means "there is a diff".
      - name: Check for migration drift
        run: >-
          pnpm --filter @inv/api exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      # Must run before typecheck: apps/web's TanStack route tree
      # (src/routeTree.gen.ts) is generated by the Vite plugin at build time
      # and is intentionally not committed, so `tsc` cannot resolve it until
      # the web bundle has been built at least once.
      - name: Build production bundles
        run: pnpm build

      - name: Typecheck workspaces
        run: pnpm -r typecheck

      - name: Run automated test suite
        run: pnpm test

  setup:
    name: First-run setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A password full of the characters that used to corrupt DATABASE_URL.
      # Until v1.1.0 docker-compose.yml spliced this into a connection URL by
      # string interpolation, and "/" terminates the URL authority — so the port
      # parsed as garbage and the API crash-looped with "invalid port number".
      # `openssl rand -base64 32` emits "/" most of the time, so this was easy
      # to hit. The URL is now assembled by apps/api/entrypoint.sh, which
      # percent-encodes it.
      - name: Resolve compose config with a hostile password
        run: |
          cat > /tmp/hostile.env <<'EOF'
          POSTGRES_PASSWORD=Str0ng#Pa:ss@2026/x?y
          BETTER_AUTH_SECRET=0123456789abcdef0123456789abcdef
          EOF
          docker compose --env-file /tmp/hostile.env config > /tmp/resolved.yml

      # The whole point: compose must not build a URL any more. If this key
      # comes back, the bug has come back with it.
      - name: Assert compose no longer composes DATABASE_URL
        run: |
          python3 - <<'PY'
          import sys, yaml
          env = yaml.safe_load(open("/tmp/resolved.yml"))["services"]["api"]["environment"]
          if "DATABASE_URL" in env:
              sys.exit(f"docker-compose.yml is building DATABASE_URL again: {env['DATABASE_URL']!r}")
          missing = [k for k in ("POSTGRES_USER", "POSTGRES_PASSWORD", "POSTGRES_DB",
                                 "POSTGRES_HOST", "POSTGRES_PORT") if k not in env]
          if missing:
              sys.exit(f"api service is missing {missing}")
          print("ok: parts passed through, no composed URL")
          PY

      - name: Assert the entrypoint encodes a hostile password
        run: |
          url=$(POSTGRES_PASSWORD='Str0ng#Pa:ss@2026/x?y' \
                sh apps/api/entrypoint.sh sh -c 'printf "%s" "$DATABASE_URL"')
          node -e '
            const u = new URL(process.argv[1]);
            if (u.port !== "5432") throw new Error(`port is ${u.port}: ${process.argv[1]}`);
            if (decodeURIComponent(u.password) !== process.argv[2]) throw new Error("password did not round-trip");
            console.log("ok:", u.protocol, u.hostname + ":" + u.port);
          ' "$url" 'Str0ng#Pa:ss@2026/x?y'

      - name: Generated secrets must be URL-safe
        run: |
          ./scripts/setup-env.sh
          test "$(stat -c '%a' .env)" = 600 || { echo ".env is not mode 600"; exit 1; }
          grep -E '^(POSTGRES_PASSWORD|BETTER_AUTH_SECRET|SEED_ADMIN_PASSWORD)=' .env \
            | grep -E '[/?#]' && { echo "a generated secret contains a URL-breaking character"; exit 1; }
          echo "ok: generated secrets are URL-safe"

      - name: setup-env.sh must never overwrite an existing .env
        run: |
          before=$(sha256sum .env)
          ./scripts/setup-env.sh
          make -B setup
          [ "$before" = "$(sha256sum .env)" ] || { echo ".env was overwritten"; exit 1; }
          echo "ok: idempotent"
