name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @inv/api db:generate

      # Must run before typecheck: apps/web's TanStack route tree
      # (src/routeTree.gen.ts) is generated by the Vite plugin at build time
      # and is intentionally not committed, so `tsc` cannot resolve it until
      # the web bundle has been built at least once.
      - name: Build production bundles
        run: pnpm build

      - name: Typecheck workspaces
        run: pnpm -r typecheck

      - name: Run automated test suite
        run: pnpm test
