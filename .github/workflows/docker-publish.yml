name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: "Push to Docker Hub (requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets)"
        required: true
        type: boolean
        default: true
      push_to_ghcr:
        description: "Push to GitHub Container Registry (ghcr.io)"
        required: true
        type: boolean
        default: true
      platforms:
        description: "Target platforms for container build"
        required: false
        type: string
        default: "linux/amd64"

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_API: server-inventory-api
  IMAGE_WEB: server-inventory-web

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry Logins
        id: check-logins
        run: |
          HAS_DOCKERHUB="false"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            HAS_DOCKERHUB="true"
          fi
          echo "has_dockerhub=${HAS_DOCKERHUB}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: ${{ steps.check-logins.outputs.has_dockerhub == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_to_dockerhub) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.check-logins.outputs.has_dockerhub == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_API) || '' }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=RackMap API
            org.opencontainers.image.description=Enterprise Server & Microservice Infrastructure Inventory Platform API
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=Nuvo AI
          annotations: |
            org.opencontainers.image.title=RackMap API
            org.opencontainers.image.description=Enterprise Server & Microservice Infrastructure Inventory Platform API
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=Nuvo AI

      - name: Build and push API Docker image
        id: build-push-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          annotations: ${{ steps.meta-api.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          provenance: false

      - name: Update Docker Hub Description (API)
        if: ${{ steps.check-logins.outputs.has_dockerhub == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_dockerhub) }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_API }}
          short-description: "Enterprise Server & Microservice Infrastructure Inventory Platform API"
          readme-filepath: ./README.md

      - name: Write API Job Summary
        if: ${{ always() && steps.build-push-api.outcome == 'success' }}
        run: |
          echo "### 🚀 API Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** `${{ github.repository }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** `${{ steps.build-push-api.outputs.digest }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **Published Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-api.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-and-push-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Registry Logins
        id: check-logins
        run: |
          HAS_DOCKERHUB="false"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            HAS_DOCKERHUB="true"
          fi
          echo "has_dockerhub=${HAS_DOCKERHUB}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: ${{ steps.check-logins.outputs.has_dockerhub == 'true' && (github.event_name != 'workflow_dispatch' || inputs.push_to_dockerhub) }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.check-logins.outputs.has_dockerhub == 'true' && format('{0}/{1}', secrets.DOCKERHUB_USERNAME, env.IMAGE_WEB) || '' }}
            ${{ env.REGISTRY_GHCR }}/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=RackMap Web UI
            org.opencontainers.image.description=Modern React SPA Dashboard for Enterprise Server & Microservice Infrastructure Inventory
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=Nuvo AI
          annotations: |
            org.opencontainers.image.title=RackMap Web UI
            org.opencontainers.image.description=Modern React SPA Dashboard for Enterprise Server & Microservice Infrastructure Inventory
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=Nuvo AI

      - name: Build and push Web Docker image
        id: build-push-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          annotations: ${{ steps.meta-web.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          provenance: false

      - name: Update Docker Hub Description (Web)
        if: ${{ steps.check-logins.outputs.has_dockerhub == 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_to_dockerhub) }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_WEB }}
          short-description: "Modern React SPA Dashboard for Enterprise Server & Microservice Infrastructure Inventory"
          readme-filepath: ./README.md

      - name: Write Web Job Summary
        if: ${{ always() && steps.build-push-web.outcome == 'success' }}
        run: |
          echo "### 🌐 Web Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** `${{ github.repository }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** `${{ steps.build-push-web.outputs.digest }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **Published Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-web.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
