name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        ⚠️ **Do not report security vulnerabilities here.** Use our
        [Security Policy](https://github.com/deziss/rackmap/blob/main/SECURITY.md) instead.

        ⚠️ **Redact before you post.** Replace real hostnames, IP addresses, domains, usernames,
        and tokens in any logs or screenshots you attach.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RackMap version
      description: From `package.json`, the release tag, or the image tag you pulled.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Docker Compose
        - Bare metal / PM2
        - Bare metal / systemd
        - Local development (pnpm dev)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Servers / inventory
        - Services
        - SSL certificates
        - SSH terminal
        - Live metrics / GPU
        - Logs / ATOP
        - OS users & sudoers
        - Auth / RBAC / access requests
        - Credential vault / encryption
        - Audit log
        - Dashboard / reports
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database
      placeholder: "SQLite (default) or PostgreSQL 16"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: API or container logs. This is rendered as code, so no backticks needed.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed all real hostnames, IPs, credentials, and customer data from this report
          required: true
