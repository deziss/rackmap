version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
      radix:
        patterns:
          - "@radix-ui/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    # Stay on the Node.js LTS line: odd majors never become LTS and even ones
    # are "Current" for six months first. Move the images by hand when the next
    # even major enters Active LTS (Node 26: October 2026).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    # Stay on the Node.js LTS line: odd majors never become LTS and even ones
    # are "Current" for six months first. Move the images by hand when the next
    # even major enters Active LTS (Node 26: October 2026).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
